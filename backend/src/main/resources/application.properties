spring.application.name=qr-generator

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qr_generator_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Server ----------
server.port=${PORT:8080}

# ---------- Session ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ---------- Multipart / misc ----------
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.example.qrgenerator=INFO